bundle:
  name: project_2026_01_01

variables:
  dataset_catalog:
    description: Target Catalog for the environment
    default: dev
  dataset_schema:
    description: Target Schema for the environment
    default: edl_test
  warehouse_id:
    description: SQL Warehouse ID

resources:
  dashboards:
    my_dashboard:
      display_name: "Test NEW feature 2026 (${bundle.target})"
      warehouse_id: ${var.warehouse_id}
      file_path: ./src/dashboards/test1.lvdash.json
      embed_credentials: true
      dataset_catalog: ${var.dataset_catalog}   #🔥 NEW
      dataset_schema: ${var.dataset_schema}     #🔥 NEW

targets:
  dev:
    mode: development
    default: true
    variables:
      dataset_catalog: dev   #🔥 NEW
      dataset_schema: edl_test     #🔥 NEW
      warehouse_id: "123456789101112"
  
  prod:
    mode: production
    variables:
      dataset_catalog: prod   #🔥 NEW
      dataset_schema: edl     #🔥 NEW
      warehouse_id: "123456789101112"